{% extends 'base.html' %}
{% block title %}Confirm Delete — {{ crop.crop_name }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <i class="bi bi-exclamation-triangle text-danger display-3 mb-3"></i>
                <h3 class="fw-bold text-dark mb-2">Delete Crop Record?</h3>
                <p class="text-muted mb-4">Are you sure you want to delete <strong>{{ crop.crop_name }}</strong>? This action cannot be undone.</p>
                <form method="post" action="{% url 'crops:delete' crop.pk %}">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'crops:detail' crop.pk %}" class="btn btn-secondary fw-bold px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger fw-bold px-4"><i class="bi bi-trash me-1"></i>Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
