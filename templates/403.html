{% extends 'base.html' %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm mx-auto mt-5" style="max-width: 640px;">
        <div class="card-body text-center p-5">
            <i class="bi bi-shield-exclamation display-1 text-danger mb-3"></i>
            <h1 class="fw-bold text-danger">Access Denied</h1>
            <p class="text-muted mb-4">
                {% if message %}
                    {{ message }}
                {% else %}
                    You do not have permission to access this page.
                {% endif %}
            </p>
            <a href="{% url 'home' %}" class="btn btn-success fw-bold">Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
